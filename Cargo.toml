[package]
name = "runweb"
version = "0.1.0"
edition = "2024"
description = "桌面工具：一键启动多个项目的前端和后端，并查看日志"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
dirs = "7.0.0"
eframe = "0.37.0"
encoding_rs = "0.8.44"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
portable-pty = "0.9.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
winreg = "0.10.1"

[profile.release]
strip = "symbols"
